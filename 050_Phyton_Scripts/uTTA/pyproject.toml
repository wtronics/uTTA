[project]
name = "utta"
version = "2.4.0"
description = "The micro Thermal Transient Analyzer"
authors = [
    {name = "wtronics"}
]
license = {text = "CC-BY-NC-SA"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.4.1,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
	"matplotlib-inline (>=0.2.1,<1.0.0)",
    "quantiphy (>=2.21,<3.0)",
    "configparser (>=7.2.0,<8.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)",
    "tksheet (>=7.5.19,<8.0.0)",
    "ttkbootstrap (>=1.20.0,<2.0.0)",
	"Jinja2 (>=3.1.6, <4.0.0)",
	"openpyxl (>=3.1.5,<4.0.0)",
	"pandas (>=2.3.3,<3.0.0)",
	"plotly (>=6.5.1,<7.0.0)",
	"pyserial (>=3.5,<4.0)",
	"schemdraw (>=0.22,<1.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
